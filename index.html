<body>
<main class="game" aria-label="Hit the Road, Dude: Whose Pond?">
  <header class="game-bar"><span id="locationText">01 / AN AFTERNOON AT THE POND</span><nav aria-label="Game controls"><button id="soundButton" aria-label="Turn sound on" aria-pressed="false">♫ <span>OFF</span></button><button id="helpButton" aria-label="How to play">?</button><button id="pauseButton" aria-label="Pause game">Ⅱ</button></nav></header>
  <section class="world" aria-label="The pond encounter">
    <canvas id="gameCanvas" width="1000" height="480" aria-label="An angler beside a pond, with a heron fishing and deer on the far bank."></canvas>
    <div class="scene-label" id="sceneLabel">A QUIET POND. NO ONE AROUND.</div>
    <div class="speech" id="speech" hidden></div>
    <div class="bite-prompt" id="bitePrompt" hidden>IT'S BITING!<span>SPACE OR REEL IN</span></div>
    <div class="pause-screen" id="pauseScreen" hidden><div class="pause-card"><span class="eyebrow">THE POND CAN WAIT</span><h1>A moment.</h1><button id="resumeButton" class="primary">Resume <span>→</span></button><button id="notesButton" class="quiet">Your reflections</button><button id="restartButton" class="quiet">Return to the pond · restart</button></div></div>
  </section>
  <section class="dialogue" id="dialogue" aria-label="Story and choices">
    <div class="dialogue-inner"><div class="speaker-row"><span id="speaker" class="speaker">YOU · AT THE WATER'S EDGE</span><span id="hint" class="hint">SPACE / TAP</span></div><h1 id="lineTitle">Just one cast.</h1><p id="lineBody">You found a quiet spot. A heron is already fishing. Cast your line and wait for a bite.</p><div id="choices" class="choices"></div><div id="fishingMeter" class="fishing-meter" hidden><span></span></div></div>
  </section>
</main>
<dialog id="infoDialog"><button id="closeDialog" class="close" aria-label="Close dialog">×</button><div id="dialogContent"></div></dialog>
<script>'use strict';
const $=id=>document.getElementById(id), canvas=$('gameCanvas'), ctx=canvas.getContext('2d');
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W=1000,H=480,ambient=0,lastTime=0,actions=[],sound=false,audioContext=null,dialogWasPaused=false,dialogFocus=null;
let state;
const beliefs=[
 {label:'It’s quiet. I’m not hurting anyone.',short:'Quiet use seemed harmless.',response:'It’s quiet. I thought one person fishing wouldn’t hurt.',note:'You treated a small impact as a reason to be here. But doing little harm and having permission are different claims. Should permission matter when the harm is small?'},
 {label:'The water and fish don’t belong to anyone.',short:'Nature should be shared.',response:'The fish were here before any of us. Why should one family decide?',note:'You began with a claim about nature itself. Yet shared resources still raise questions about care, overuse, and whose needs count.'},
 {label:'I don’t know that I have the right. I just wanted to fish.',short:'Desire was not permission.',response:'Nobody told me I could. I wanted to fish, and I should have asked.',note:'You separated wanting something from having a claim to it. That leaves open the question of whether the rules for access are fair.'}
];
const challenges=[
 {label:'Owning the bank means you can keep everyone from the pond?',reply:'“My son looks after this place. People leave hooks, line, trash. He gets to decide who comes in.”',note:'A home deserves privacy, and care takes work. Does protecting a home justify controlling every use of a natural pond, or should those boundaries differ?'},
 {label:'That heron can take a fish. Why can’t I?',reply:'“The bird lives out here. It isn’t asking me to open this place up to every person with a fishing rod.”',note:'He draws a line between wildlife using habitat and people claiming access. Is the difference need, impact, or simply who can be told to leave?'},
 {label:'Your son bought it. But who first got to say “mine”?',reply:'“We bought this place. We maintain it. I’m not debating the history of the whole world with you.”',note:'A purchase explains how his son got the claim. It does not, by itself, settle why the institution of ownership is justified.'}
];
const exits=[
 {label:'I’ll leave. I still think access should be shared.',reply:'“You can think whatever you want. Just do it off this property.”',short:'Left, without agreeing.'},
 {label:'Could I ask your son for permission another time?',reply:'“Ask him first, then. Right now, you need to go. I’m not giving you permission.”',short:'Asked for a way back.'},
 {label:'What if visitors helped care for the pond?',reply:'“That’s something you can take up with my son. It doesn’t mean you can stay today.”',short:'Offered shared care.'}
];
const animalViews=[
 {label:'We’re animals too. Our need for nature should count.',short:'Belonging',note:'You include humans within nature. But the heron is feeding in its habitat; you came for recreation. Would your argument change if you needed the fish to eat?'},
 {label:'People can cause harm on a different scale.',short:'Responsibility',note:'Numbers, tools, and lasting damage can justify limits. But “humans can cause harm” does not tell us which limits are fair, or whether every quiet visitor should be excluded.'},
 {label:'Property is an agreement animals never made.',short:'Human rules',note:'A deer cannot recognize a deed, though animals can defend territories too. Human ownership adds rules and enforcement. Rules we create can be questioned—and changed.'}
];
const accessViews=[
 {label:'The owner decides, including saying no.',short:'Owner’s permission',title:'Permission, with a question.',note:'You give the person responsible for the land the strongest say. The cost: access to nature can depend on whom you know, what you own, or what you can afford.'},
 {label:'Allow limited access with rules for care and wildlife.',short:'Conditional access',title:'A gate that could open.',note:'You favor access with limits: sensitive areas, visitor numbers, cleanup, and protection for wildlife. Someone still has to make those rules, pay for care, and resolve disagreements.'},
 {label:'Make places like this a shared, managed resource.',short:'A cared-for commons',title:'The pond as a commons.',note:'You favor shared access and shared responsibility. A commons needs governance, not just an open gate. How would you include the people doing the work—and protect animals that cannot vote?'}
];
const reciprocityViews=[
 {label:'Take less. Leave enough for the pond’s other lives.',short:'Restraint',note:'You choose limits on what you take. A gift is not an endless supply. Would you still accept a limit when it means going home empty-handed?'},
 {label:'Give time: clean the bank and help restore habitat.',short:'Shared care',note:'You offer work in return for access. Care can build trust, but people with little free time still need nature. How could responsibility be shared fairly?'},
 {label:'Help make rules with neighbors and the people caring for it.',short:'Collective responsibility',note:'You choose cooperation: agree on access, catch limits, and care. The challenge is keeping a voice for people outside the circle—and a place for wildlife.'}
];
function reset(){document.querySelectorAll('.summary-tags').forEach(n=>n.remove());$('dialogue').inert=false;$('pauseButton').textContent='Ⅱ';$('pauseButton').setAttribute('aria-label','Pause game');state={phase:'fishing',paused:false,time:0,castProgress:0,truckProgress:0,walkProgress:0,belief:null,challenge:null,exit:null,animal:null,access:null,reciprocity:null,catchResult:null,notes:[]};document.querySelector('.game').classList.remove('paused','outcome');$('pauseScreen').hidden=true;$('speech').hidden=true;$('bitePrompt').hidden=true;fishingStart();}
function phase(name){state.phase=name;document.querySelector('.game').setAttribute('data-phase',name);state.time=0;$('bitePrompt').hidden=true;$('fishingMeter').hidden=true;}
function setLocation(text,label){$('locationText').textContent=text;$('sceneLabel').textContent=label;}
function present({speaker,title,body='',options=[],hint='',numbered=false}){
 $('speaker').textContent=speaker;$('lineTitle').textContent=title;$('lineBody').textContent=body;$('lineBody').hidden=!body;$('hint').textContent=hint|| (numbered?'1 / 2 / 3 · CHOOSE':'');
 $('choices').replaceChildren();actions=options;$('choices').classList.toggle('single',!numbered);
 options.forEach((option,i)=>{const b=document.createElement('button');b.className=numbered?'choice':option.quiet?'quiet':'primary';b.disabled=!!option.disabled;
 if(numbered){const k=document.createElement('span');k.className='choice-key';k.textContent=String(i+1).padStart(2,'0');const text=document.createElement('strong');text.textContent=option.label;b.append(k,text);}else{b.textContent=option.label;if(!option.quiet){const arrow=document.createElement('span');arrow.textContent='→';b.append(arrow);}}
 b.addEventListener('click',()=>activate(i));$('choices').append(b);});
 $('dialogue').scrollTop=0;
 if(!['fishing','waiting','bite'].includes(state.phase))$('choices').querySelector('button:not(:disabled)')?.focus({preventScroll:true});
}
function activate(i){if(state.paused||$('infoDialog').open||!actions[i]||actions[i].disabled)return;const fn=actions[i].run;fn?.();}
function say(text){$('speech').textContent=text;$('speech').hidden=!text;}
function note(topic,choice,thought){state.notes.push({topic,choice,thought});}
function fishingStart(){phase('fishing');setLocation('01 / AN AFTERNOON AT THE POND','A QUIET POND. NO ONE AROUND.');present({speaker:'YOU · AT THE WATER’S EDGE',title:'Just one cast.',body:'You found a quiet spot. A heron is already fishing. Cast your line and wait for a bite.',hint:'SPACE / TAP',options:[{label:'Cast your line',run:cast}]});}
function cast(){phase('waiting');state.castProgress=0;beep(310,.12);present({speaker:'YOU · FISHING',title:'Watch the float.',body:'Wait for it to dip, then reel in. There’s no rush to get anywhere.',hint:'WAIT FOR THE BITE',options:[]});$('fishingMeter').hidden=false;}

function askBelief(){phase('belief');setLocation('01 / BEFORE ANYONE ASKS','YOU CHOSE THIS SPOT. BUT ON WHAT BASIS?');present({speaker:'YOUR THOUGHT',title:'Why did you think it was right to fish here?',body:'The pond feels like a gift you found, not something you made. Does that make it yours to use?',numbered:true,options:beliefs.map((b,i)=>({label:b.label,run:()=>{state.belief=i;note('Before the encounter',b.label,b.note);arrival();}}))});}
function arrival(){phase('arrival');setLocation('02 / A WHITE TRUCK','TIRES ON THE GRAVEL. SOMEONE IS COMING.');present({speaker:'THE POND',title:'An engine breaks the quiet.',body:'A white pickup turns onto the track and pulls up beside you.',hint:'',options:[]});beep(85,.9,'sawtooth',.015);}
function confrontation(){phase('confrontation');setLocation('02 / THE CONFRONTATION','THE TRUCK STOPS BESIDE YOU.');say('');present({speaker:'THE MAN IN THE WHITE TRUCK',title:'“Who said you could fish here?”',body:'He leans out of the window. Your peaceful fishing spot suddenly feels like somebody else’s place.',numbered:true,options:[{label:beliefs[state.belief].response,run:()=>boundary('belief')},{label:'I thought this was state property.',run:()=>boundary('state')},{label:'Is this your land?',run:()=>boundary('owner')}]});}
